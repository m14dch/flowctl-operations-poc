# Dex: lightweight OIDC provider used for operator login (local PoC only).
issuer: http://dex:5556/dex
issuerRotation:
  - issuer: http://localhost:5556/dex

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556

staticClients:
  - id: flowctl
    name: flowctl
    secretEnv: OIDC_CLIENT_SECRET
    redirectURIs:
      - "http://localhost:7070/auth/callback"

oauth2:
  skipApprovalScreen: true

enablePasswordDB: true

# Demo users. Passwords: operator-demo / noaccess-demo (local PoC only).
